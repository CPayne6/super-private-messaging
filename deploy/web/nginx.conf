server { listen 8080; server_name _; root /usr/share/nginx/html; index index.html; server_tokens off;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; form-action 'self'; require-trusted-types-for 'script'" always;
  add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always;
  location = /index.html { add_header Cache-Control "no-store" always; try_files /index.html =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location /api/ { proxy_pass http://api:8010/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /ws { proxy_pass http://api:8010/ws; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
