name: Build and deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            target: api
          - image: migrate
            target: migrate
          - image: web
            target: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/cpayne6/super-private-messaging-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/cpayne6/super-private-messaging-${{ matrix.image }}:production

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Cloudflare Access client
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -O /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version
      - name: Configure Cloudflare Access SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # GitHub secrets pasted from Windows can retain CRLF line endings. OpenSSH
          # requires a valid, newline-terminated private-key file.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/spm_deploy_key
          chmod 600 ~/.ssh/spm_deploy_key
          cat > ~/.ssh/config << EOF
          Host spm-prod
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/spm_deploy_key
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname ${{ secrets.DEPLOY_HOST }} --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config
      - name: Copy deployment files
        run: |
          ssh spm-prod "mkdir -p '${{ vars.DEPLOY_PROJECT_DIR }}/scripts'"
          scp docker-compose.prod.yml "spm-prod:${{ vars.DEPLOY_PROJECT_DIR }}/docker-compose.prod.yml"
          scp scripts/deploy.sh "spm-prod:${{ vars.DEPLOY_PROJECT_DIR }}/scripts/deploy.sh"
      - name: Deploy stack
        run: |
          ssh spm-prod "chmod +x '${{ vars.DEPLOY_PROJECT_DIR }}/scripts/deploy.sh' && cd '${{ vars.DEPLOY_PROJECT_DIR }}' && PROJECT_DIR='${{ vars.DEPLOY_PROJECT_DIR }}' GITHUB_REPOSITORY_OWNER=cpayne6 IMAGE_TAG=${{ github.sha }} ./scripts/deploy.sh"
      - name: Collect Swarm diagnostics
        if: failure()
        run: |
          ssh spm-prod '
            docker stack services spm || true
            for service in postgres redis migrate api web cloudflared; do
              echo "===== spm_${service} tasks ====="
              docker service ps "spm_${service}" --no-trunc || true
            done
            echo "===== node resources ====="
            docker node inspect self --format "{{json .Description.Resources}}" || true
            echo "===== Docker summary ====="
            docker info --format "{{json .DriverStatus}}" || true
            docker ps -a --no-trunc || true
          ' > /tmp/swarm-diagnostics.txt 2>&1 || true
      - name: Upload Swarm diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-diagnostics
          path: /tmp/swarm-diagnostics.txt
          if-no-files-found: warn
